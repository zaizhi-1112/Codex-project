<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面倒计时提醒器</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --border: #1f2937;
      --accent: #38bdf8;
      --accent-strong: #0ea5e9;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --danger: #f43f5e;
      --success: #22c55e;
      --warning: #fbbf24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(56,189,248,0.08), transparent 30%),
        radial-gradient(circle at 80% 0%, rgba(94,234,212,0.07), transparent 25%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: min(1100px, 100%);
      background: rgba(17,24,39,0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      padding: 22px;
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    p.subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 16px;
    }

    @media (max-width: 920px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
    }

    .input-small {
      padding: 10px 12px;
      font-size: 14px;
    }

    .row { display: flex; gap: 10px; }
    .row .input { flex: 1; }

    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.05s ease, filter 0.15s;
      color: #0b1220;
      font-size: 14px;
      user-select: none;
    }

    button:active { transform: translateY(1px) scale(0.99); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .primary { background: linear-gradient(120deg, var(--accent), var(--accent-strong)); color: #0b1220; }
    .ghost { background: #0b1220; color: var(--text); border: 1px solid var(--border); }
    .danger { background: var(--danger); color: #fff; }
    .success { background: var(--success); color: #0b1220; }

    .btn-mini {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
    }

    .timers-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .timer-item {
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

    .timer-item.running { border-color: rgba(56,189,248,0.45); }
    .timer-item.paused { border-color: rgba(251,191,36,0.45); }
    .timer-item.done { border-color: rgba(34,197,94,0.35); }
    .timer-item.locked { border-color: rgba(244,63,94,0.55); }

    .timer-item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .timer-item-remaining {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .timer-item-sub {
      margin-top: 4px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--muted);
      font-weight: 700;
    }

    .timer-item-fields {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .timer-item-btns {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .timer {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
    }

    .timer .big {
      font-size: clamp(38px, 8vw, 64px);
      font-weight: 900;
    }

    .status {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.5;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      flex-wrap: wrap;
    }

    .switch input { accent-color: var(--accent); width: 18px; height: 18px; }

    .log {
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      height: 160px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }

    .log strong { color: var(--accent); }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .modal.active { display: flex; }

    .modal-box {
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 22px;
      width: min(460px, 100%);
      text-align: center;
      box-shadow: 0 15px 45px rgba(0,0,0,0.4);
    }

    .modal-box h2 { margin: 0 0 8px; font-size: 20px; }
    .modal-box p { margin: 0 0 12px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }

    .modal-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>桌面倒计时提醒器</h1>
    <p class="subtitle">支持多个倒计时同时开始；到点提醒：声音 / 震动 / 桌面通知 / 弹窗。</p>

    <div class="grid">
      <div class="card">
        <label class="label">倒计时列表</label>
        <div class="timers-list" id="timersList"></div>

        <div class="btns">
          <button class="primary" id="startAllBtn" type="button">全部开始</button>
          <button class="ghost" id="pauseAllBtn" type="button" disabled>全部暂停</button>
          <button class="ghost" id="resetAllBtn" type="button">全部重置</button>
          <button class="success" id="addTimerBtn" type="button">+ 新增</button>
          <button class="ghost" id="testBtn" type="button">试一试提醒</button>
        </div>

        <div style="margin-top:12px; border-top: 1px solid var(--border); padding-top: 12px;">
          <div class="switch">
            <input type="checkbox" id="soundToggle" checked>
            <label for="soundToggle">声音提醒</label>
          </div>
          <div class="switch">
            <input type="checkbox" id="vibrationToggle" checked>
            <label for="vibrationToggle">震动（移动设备）</label>
          </div>
          <div class="switch">
            <input type="checkbox" id="notificationToggle" checked>
            <label for="notificationToggle">桌面通知（需授权）</label>
            <button class="ghost btn-mini" id="notificationPermBtn" type="button">授权</button>
          </div>
          <div class="hint" id="notificationStatus"></div>

          <div class="switch">
            <input type="checkbox" id="popupToggle">
            <label for="popupToggle">浮窗模式（到点弹出对话框）</label>
          </div>
          <div class="hint">优先使用“置顶浮窗”（Document PiP，Chrome/Edge，需 http(s)）；不支持时退化为普通弹出窗口（可能无法抢到前台）。</div>

          <div class="hint">提示：网页无法强制切到前台；要“在别的页面也能看到提醒”，建议开启桌面通知或浮窗模式。（关闭本页会停止计时）</div>
        </div>
      </div>

      <div class="card">
        <div class="timer">
          <div class="big" id="nextDisplay">--:--</div>
        </div>
        <div class="status" id="summaryText">待开始</div>
        <div class="hint" id="nextLabel"></div>

        <label class="label" style="margin-top:14px;">日志</label>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h2 id="modalTitle">时间到</h2>
      <p id="modalMsg">时间到！</p>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="btns" style="justify-content:center; margin-top:6px;">
        <button class="ghost" id="dismissBtn" type="button">我知道了</button>
        <button class="primary" id="againBtn" type="button">再次开始</button>
      </div>
    </div>
  </div>

  <script>
    const APP_TITLE = '桌面倒计时提醒器';
    const STORAGE_KEY = '提醒时钟-configs';

    const timersListEl = document.getElementById('timersList');
    const startAllBtn = document.getElementById('startAllBtn');
    const pauseAllBtn = document.getElementById('pauseAllBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');
    const addTimerBtn = document.getElementById('addTimerBtn');
    const testBtn = document.getElementById('testBtn');

    const soundToggle = document.getElementById('soundToggle');
    const vibrationToggle = document.getElementById('vibrationToggle');
    const notificationToggle = document.getElementById('notificationToggle');
    const notificationPermBtn = document.getElementById('notificationPermBtn');
    const notificationStatus = document.getElementById('notificationStatus');
    const popupToggle = document.getElementById('popupToggle');

    const nextDisplay = document.getElementById('nextDisplay');
    const summaryText = document.getElementById('summaryText');
    const nextLabel = document.getElementById('nextLabel');
    const logBox = document.getElementById('log');

    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalMsg = document.getElementById('modalMsg');
    const modalMeta = document.getElementById('modalMeta');
    const dismissBtn = document.getElementById('dismissBtn');
    const againBtn = document.getElementById('againBtn');

    const timers = [];
    const timerEls = new Map();
    let nextTimerId = 1;

    const saveTimersConfig = () => {
      try {
        const configs = timers.map(t => ({
          id: t.id,
          duration: t.duration,
          message: t.message,
          autoRepeat: !!t.autoRepeat,
          locked: !!t.locked
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ nextTimerId, configs }));
      } catch (err) {
        console.error('保存任务配置失败', err);
      }
    };

    const loadTimersConfig = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (parsed && parsed.nextTimerId && Number.isFinite(parsed.nextTimerId)) {
          nextTimerId = parsed.nextTimerId;
        }
        if (parsed && Array.isArray(parsed.configs)) {
          const maxId = parsed.configs.reduce((max, cfg) => Math.max(max, cfg.id || 0), 0);
          if (!parsed.nextTimerId && maxId >= nextTimerId) {
            nextTimerId = maxId + 1;
          }
          return parsed.configs;
        }
      } catch (err) {
        console.warn('加载任务配置失败', err);
      }
      return [];
    };

    let ticker = null;

    // Alerts queue
    const pendingAlerts = [];
    let currentAlertId = null;

    // WebAudio alarm
    let audioContext = null;
    let alarmInterval = null;
    let alarmStopTimeout = null;

    // Floating window (优先置顶浮窗 Document PiP)
    let popupWindow = null;
    let popupWindowKind = null; // 'pip' | 'popup'

    const clampInt = (value, min, max) => {
      const n = Number.parseInt(String(value ?? ''), 10);
      if (Number.isNaN(n)) return min;
      return Math.max(min, Math.min(max, n));
    };

    const formatSeconds = (totalSeconds) => {
      const s = Math.max(0, Math.floor(totalSeconds));
      const m = Math.floor(s / 60);
      const ss = s % 60;
      return `${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
    };

    const log = (msg) => {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.innerHTML = `<strong>[${time}]</strong> ${msg}`;
      logBox.prepend(div);
    };

    // Notifications
    const getNotificationStatusText = () => {
      if (!('Notification' in window)) return '桌面通知：当前浏览器不支持';
      if (!window.isSecureContext) return '桌面通知：在 file:// 下可能不可用，建议用 http://localhost 打开';
      if (Notification.permission === 'granted') return '桌面通知：已授权';
      if (Notification.permission === 'denied') return '桌面通知：已拒绝（请在浏览器设置中开启）';
      return '桌面通知：未授权（点击“授权”）';
    };

    const refreshNotificationStatus = () => {
      notificationStatus.textContent = getNotificationStatusText();
    };

    const requestNotificationPermission = async () => {
      if (!('Notification' in window)) return false;
      if (!window.isSecureContext) return false;
      if (Notification.permission === 'granted') return true;
      if (Notification.permission === 'denied') return false;

      try {
        const perm = await Notification.requestPermission();
        return perm === 'granted';
      } catch {
        return false;
      }
    };

    const fireNotification = (title, body) => {
      if (!notificationToggle.checked) return;
      if (!('Notification' in window)) return;
      if (!window.isSecureContext) return;
      if (Notification.permission !== 'granted') return;

      const n = new Notification(title, {
        body,
        icon: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAASFBMVEX/////AAD/AAAAAAAAAAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AAD/AADs1yZKAAAAKklEQVR42mNgoBpgwAEsTIxgYGBkYBQxEkYGRgYmBiYQpRKR2MUNYwFAAAtVAkPuhSijMAAAAASUVORK5CYII='
      });
      setTimeout(() => n.close(), 8000);
    };

    // Vibration
    const vibrate = () => {
      if (!vibrationToggle.checked) return;
      if (navigator.vibrate) navigator.vibrate([200,120,200,120,400]);
    };

    // Audio
    const ensureAudioContext = () => {
      if (audioContext) return audioContext;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioContext = new Ctx();
      return audioContext;
    };

    const unlockAudio = async () => {
      const ctx = ensureAudioContext();
      if (!ctx) {
        log('当前浏览器不支持 WebAudio，无法播放提示音');
        return false;
      }

      try {
        if (ctx.state === 'suspended') await ctx.resume();

        // 轻微“静音”脉冲：用于解锁部分浏览器的音频策略
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 440;
        gain.gain.value = 0.0001;
        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.01);
        return true;
      } catch {
        log('音频被浏览器阻止：请点击页面后再试');
        return false;
      }
    };

    const beepOnce = (frequency = 880, durationMs = 180, volume = 0.18) => {
      if (!soundToggle.checked) return;
      const ctx = ensureAudioContext();
      if (!ctx || ctx.state === 'suspended') return;

      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.value = frequency;

      const now = ctx.currentTime;
      const duration = Math.max(0.03, durationMs / 1000);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      oscillator.start(now);
      oscillator.stop(now + duration + 0.02);
    };

    const stopAlarmSound = () => {
      if (alarmInterval) clearInterval(alarmInterval);
      if (alarmStopTimeout) clearTimeout(alarmStopTimeout);
      alarmInterval = null;
      alarmStopTimeout = null;
    };

    const startAlarmSound = () => {
      stopAlarmSound();
      if (!soundToggle.checked) return;

      beepOnce(880, 220, 0.22);
      alarmInterval = setInterval(() => {
        beepOnce(880, 180, 0.2);
      }, 900);

      alarmStopTimeout = setTimeout(stopAlarmSound, 60_000);
    };

    // Floating window (优先置顶浮窗 Document PiP)
    const getPopupHtml = () => `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倒计时浮窗</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #0b1220;
      --border: #1f2937;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --warning: #fbbf24;
      --success: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      padding: 12px;
    }

    .next {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .time {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }

    .summary {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .msg {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow: auto;
      padding-right: 6px;
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: center;
    }

    .item .t {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      letter-spacing: 1px;
      min-width: 72px;
    }

    .item .m {
      font-size: 12px;
      color: var(--text);
      line-height: 1.35;
    }

    .item .s {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .item.running { border-color: rgba(56,189,248,0.55); }
    .item.paused { border-color: rgba(251,191,36,0.45); }
    .item.done { border-color: rgba(34,197,94,0.35); }

    .btns {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .primary { background: var(--accent); color: #0b1220; }

    .alert-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.74);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 10;
    }

    .alert-box {
      width: 100%;
      border: 1px solid rgba(56,189,248,0.75);
      border-radius: 14px;
      background: rgba(11,18,32,0.98);
      box-shadow: 0 18px 55px rgba(0,0,0,0.5);
      padding: 14px;
    }

    .alert-title {
      font-size: 18px;
      font-weight: 900;
      margin: 0 0 6px;
      letter-spacing: 0.3px;
    }

    .alert-msg {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .alert-meta {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .alert-btns {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="next">
      <div class="time" id="popupNextTime">--:--</div>
      <div class="summary" id="popupSummary"></div>
    </div>
    <div class="msg" id="popupNextMsg"></div>

    <div class="list" id="popupList"></div>

    <div class="btns">
      <button class="ghost" onclick="window.close()">关闭</button>
      <button class="primary" onclick="try{opener&&opener.focus&&opener.focus();}catch(e){}">回到主页面</button>
    </div>
  </div>

  <div class="alert-overlay" id="popupAlert" role="dialog" aria-modal="true">
    <div class="alert-box">
      <div class="alert-title" id="popupAlertTitle">时间到</div>

        }
        if (resumed > 0) log(`全部继续：继续 ${resumed} 个倒计时`);
      }

      updateSummary();
      updateGlobalControls();
      stopTickerIfIdle();
    });

    resetAllBtn.addEventListener('click', () => {
      for (const timer of timers) {
        timer.status = 'idle';
        timer.endAt = null;
        timer.remaining = timer.duration;
        syncTimerRow(timer);
      }

      clearInterval(ticker);
      ticker = null;

      pendingAlerts.length = 0;
      currentAlertId = null;
      stopAlarmSound();
      hideModal();

      updateSummary();
      updateGlobalControls();
      log('全部重置');
    });

    addTimerBtn.addEventListener('click', () => {
      addTimer({ minutes: 0, seconds: 30, message: '时间到！请查看提醒。' });
    });

    testBtn.addEventListener('click', async () => {
      await beforeStartActions();

      startAlarmSound();
      vibrate();
      fireNotification('测试提醒', '这是一条测试提醒');

      modalTitle.textContent = '测试提醒';
      modalMsg.textContent = '这是一条测试提醒（用于确认弹窗/声音/通知是否正常）';
      modalMeta.textContent = '';
      modal.dataset.timerId = '';
      modal.classList.add('active');

      log('触发测试提醒');
    });

    // Settings
    notificationPermBtn.addEventListener('click', async () => {
      if (!notificationToggle.checked) notificationToggle.checked = true;
      const ok = await requestNotificationPermission();
      refreshNotificationStatus();
      log(ok ? '桌面通知已授权' : '桌面通知未授权/不可用');
    });

    notificationToggle.addEventListener('change', () => {
      refreshNotificationStatus();
      if (
        notificationToggle.checked &&
        'Notification' in window &&
        window.isSecureContext &&
        Notification.permission === 'default'
      ) {
        log('提示：点击“授权”启用桌面通知');
      }
    });

    popupToggle.addEventListener('change', async () => {
      if (popupToggle.checked) {
        const ok = await openPopupWindow();
        if (!ok) {
          popupToggle.checked = false;
          log('浮窗打开失败：请允许此页面弹出窗口');
          return;
        }

        if (popupWindowKind === 'pip') {
          log('已开启置顶浮窗（Document PiP）');
        } else {
          log('已打开浮窗（普通弹出窗口）');
        }

        return;
      }

      closePopupWindow();
      log('已关闭浮窗');
    });

    // Modal actions
    const hideTestModal = () => {
      stopAlarmSound();
      modal.classList.remove('active');
      delete modal.dataset.timerId;

      if (pendingAlerts.length > 0) {
        showNextAlert();
      }
    };

    dismissBtn.addEventListener('click', () => {
      if (!modal.dataset.timerId) {
        hideTestModal();
        return;
      }
      acknowledgeCurrentAlert({ restart: false });
    });

    againBtn.addEventListener('click', async () => {
      if (!modal.dataset.timerId) {
        hideTestModal();
        return;
      }

      await unlockAudio();
      acknowledgeCurrentAlert({ restart: true });
    });

    modal.addEventListener('click', (e) => {
      if (e.target !== modal) return;

      if (!modal.dataset.timerId) {
        hideTestModal();
        return;
      }

      acknowledgeCurrentAlert({ restart: false });
    });

    // Initial
    refreshNotificationStatus();
    if (!window.isSecureContext) {
      log('提示：若需桌面通知，请用 http://localhost 打开（file:// 可能不可用）');
    }

    const storedConfigs = loadTimersConfig();
    if (storedConfigs.length > 0) {
      storedConfigs.forEach(cfg => {
          addTimer({
            id: cfg.id,
            duration: cfg.duration,
            message: cfg.message,
            autoRepeat: cfg.autoRepeat,
            locked: cfg.locked,
            skipSave: true
          });

      });
      log(`加载 ${storedConfigs.length} 条已保存任务`);
    } else {
      addTimer({ minutes: 0, seconds: 30, message: '时间到！请查看提醒。' });
      addTimer({ minutes: 5, seconds: 0, message: '休息一下 / 喝水' });
    }

    updateSummary();
    updateGlobalControls();
    log('准备就绪');
  </script>
</body>
</html>
